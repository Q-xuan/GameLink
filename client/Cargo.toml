[package]
name = "gamelink"
version = "0.3.0"
edition = "2021"
description = "GameLink Windows client"
publish = false
license = "MIT"

[dependencies]
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "fira-sans"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_Ndis",
    "Win32_UI_Shell",
] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
